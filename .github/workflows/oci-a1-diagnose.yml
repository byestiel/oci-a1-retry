name: OCI A1 Diagnose

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oci-a1-diagnose
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install OCI SDK
        run: python -m pip install --disable-pip-version-check "oci==2.185.1"
      - name: Diagnose OCI configuration
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_AD_NAME: ${{ secrets.OCI_AD_NAME }}
        run: |
          python -u - <<'PY'
          import os
          import sys
          import oci
          
          rows = []
          
          def record(label, status, detail):
              text = str(detail).replace('\n', ' ')[:700]
              for key, value in os.environ.items():
                  if key.startswith('OCI_') and value:
                      text = text.replace(value, '[REDACTED]')
              rows.append((label, status, text))
              print(f'[{status}] {label}: {text}', flush=True)
          
          def check(label, good, detail):
              record(label, 'OK' if good else 'CHECK', detail)
          
          def query(label, fn):
              try:
                  data = fn().data
                  record(label, 'OK', '조회 성공 (생성 권한을 증명하지는 않습니다)')
                  return data
              except oci.exceptions.ServiceError as exc:
                  record(label, 'UNKNOWN', f'HTTP {exc.status} / {exc.code}; 자원/조회 권한 확인 필요')
              except Exception as exc:
                  record(label, 'UNKNOWN', type(exc).__name__)
              return None
          
          def main():
              record('진단 버전', 'INFO', '2 - 사용자가 복사한 실제 서브넷과 비교')
              keys = ('USER_OCID', 'TENANCY_OCID', 'FINGERPRINT', 'REGION',
                      'PRIVATE_KEY', 'COMPARTMENT_OCID', 'SUBNET_OCID', 'IMAGE_OCID', 'AD_NAME')
              missing = ['OCI_' + k for k in keys if not os.getenv('OCI_' + k, '').strip()]
              if missing:
                  record('Secrets', 'CHECK', '누락: ' + ', '.join(missing))
                  return
              e = {k: os.environ['OCI_' + k].strip() for k in keys}
              expected_subnet = 'ocid1.subnet.oc1.ap-chuncheon-1.aaaaaaaafv6qycjmsrotm6a32trsmmmplnr3577zbsgrx4ua3gtanknqzcvq'
              same_subnet = e['SUBNET_OCID'] == expected_subnet
              check('저장된 서브넷 OCID 일치', same_subnet,
                    '일치' if same_subnet else '불일치: GitHub OCI_SUBNET_OCID를 사용자가 Copy한 값으로 저장하세요')
              check('춘천 리전 설정', e['REGION'] == 'ap-chuncheon-1',
                    '기존 Micro 서버가 있는 춘천 리전과 일치하는지 확인')
              check('기존 서버 AD와 일치', e['AD_NAME'] == 'uTzO:AP-CHUNCHEON-1-AD-1',
                    '사용자가 기존 서버에서 조회한 전체 AD 이름과 비교')
              config = dict(user=e['USER_OCID'], tenancy=e['TENANCY_OCID'],
                            fingerprint=e['FINGERPRINT'], region=e['REGION'],
                            key_content=e['PRIVATE_KEY'])
              opts = dict(timeout=(10, 20), retry_strategy=oci.retry.NoneRetryStrategy())
              identity = oci.identity.IdentityClient(config, **opts)
              network = oci.core.VirtualNetworkClient(config, **opts)
              compute = oci.core.ComputeClient(config, **opts)
          
              ads = query('현재 계정의 AD 조회', lambda: identity.list_availability_domains(e['TENANCY_OCID']))
              if ads is not None:
                  check('AD 존재 여부', any(a.name == e['AD_NAME'] for a in ads),
                        '설정한 AD가 이 계정/리전의 조회 결과에 포함되는지 확인')
          
              subnet = query('서브넷 조회', lambda: network.get_subnet(e['SUBNET_OCID']))
              if not same_subnet:
                  confirmed_subnet = query('복사한 실제 서브넷 직접 조회', lambda: network.get_subnet(expected_subnet))
                  if confirmed_subnet is not None:
                      record('서브넷 비교 결과', 'INFO', '실제 서브넷 접근 성공. 저장된 OCI_SUBNET_OCID가 다른 것이 확인됐습니다.')
              if subnet is not None:
                  check('서브넷 상태', subnet.lifecycle_state == 'AVAILABLE', subnet.lifecycle_state)
                  check('공인 IP 허용', subnet.prohibit_public_ip_on_vnic is False,
                        '공인 IP 생성 금지=' + str(subnet.prohibit_public_ip_on_vnic))
                  check('서브넷과 AD 호환', not subnet.availability_domain or subnet.availability_domain == e['AD_NAME'],
                        '리전 서브넷 또는 생성 대상 AD와 일치해야 합니다')
                  record('서브넷 구획', 'INFO', '생성 대상과 동일' if subnet.compartment_id == e['COMPARTMENT_OCID']
                         else '생성 대상과 다름; 이 자체는 오류가 아니며 양쪽 구획의 권한이 필요합니다')
          
              image = query('이미지 상세 조회', lambda: compute.get_image(e['IMAGE_OCID']))
              if image is not None:
                  check('이미지 상태', image.lifecycle_state == 'AVAILABLE', image.lifecycle_state)
                  record('이미지 정보', 'INFO', f'{image.display_name} / {image.operating_system} {image.operating_system_version}')
              query('이미지 A1 호환성', lambda: compute.get_image_shape_compatibility_entry(e['IMAGE_OCID'], 'VM.Standard.A1.Flex'))
          
              if e['COMPARTMENT_OCID'] == e['TENANCY_OCID']:
                  query('생성 대상 루트 구획', lambda: identity.get_tenancy(e['TENANCY_OCID']))
              else:
                  compartment = query('생성 대상 구획 조회', lambda: identity.get_compartment(e['COMPARTMENT_OCID']))
                  if compartment is not None:
                      check('구획 상태', compartment.lifecycle_state == 'ACTIVE', compartment.lifecycle_state)
          
              user = query('API 사용자 조회', lambda: identity.get_user(e['USER_OCID']))
              if user is not None:
                  check('API 사용자 상태', user.lifecycle_state == 'ACTIVE', user.lifecycle_state)
              memberships = query('API 사용자 그룹 조회', lambda: oci.pagination.list_call_get_all_results(
                  identity.list_user_group_memberships, compartment_id=e['TENANCY_OCID'], user_id=e['USER_OCID']))
              if memberships is not None:
                  record('조회된 그룹 수', 'INFO', len(memberships))
                  for membership in memberships[:5]:
                      group = query('그룹 상세 조회', lambda m=membership: identity.get_group(m.group_id))
                      if group is not None:
                          record('그룹 이름', 'INFO', group.name)
                  record('그룹 조회 범위', 'INFO', '최대 5개 이름 표시. 도메인/연동 그룹은 별도 확인이 필요할 수 있습니다.')
          
          try:
              main()
          except Exception as exc:
              record('진단 실행', 'UNKNOWN', type(exc).__name__)
          finally:
              print('\n진단 완료. OK=조회/조건 통과, CHECK=설정 불일치, UNKNOWN=조회 실패/미확인.')
              print('모든 조회가 OK여도 인스턴스 생성·네트워크 사용·부팅 볼륨 생성 권한까지 확인된 것은 아닙니다.')
              print('서버 생성/삭제 및 권한 변경은 수행하지 않았습니다.')
              summary = os.getenv('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as f:
                      f.write('## OCI A1 진단 결과\n\n| 항목 | 결과 | 설명 |\n|---|---|---|\n')
                      for label, status, detail in rows:
                          clean = detail.replace('|', '/').replace('<', '&lt;').replace('>', '&gt;').replace('`', '')
                          f.write(f'| {label} | {status} | {clean} |\n')
                      f.write('\n**조회 성공은 서버 생성 권한의 증명이 아닙니다.**\n')
              sys.exit(1 if any(r[1] in ('CHECK', 'UNKNOWN') for r in rows) else 0)
          PY
